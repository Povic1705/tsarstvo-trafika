name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          mkdir -p public/privacy
          cp CNAME .nojekyll styles.css public/
          cp privacy/index.html public/privacy/
          if grep -qE '^\s*siteOn:\s*true\b' config.js; then
            mkdir -p public/thanks
            cp home.html public/index.html
            cp config.js script.js public/
            cp thanks/index.html public/thanks/
            cp -R images public/images
          else
            cp index.html public/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
